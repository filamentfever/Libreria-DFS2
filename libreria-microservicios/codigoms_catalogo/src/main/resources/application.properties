spring.application.name=codigoms-catalogo
server.port=8097

# Base de datos propia del microservicio: MySQL / MariaDB (se administra desde phpMyAdmin)
# La base "libreria_catalogo" se crea sola la primera vez (createDatabaseIfNotExist=true).
# Por defecto: usuario root sin contraseña (XAMPP). Se cambian con las variables de entorno DB_USER / DB_PASSWORD / DB_HOST / DB_PORT.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/libreria_catalogo?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
# update: crea/ajusta las tablas y CONSERVA los datos entre reinicios (con H2 se borraban)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Registro en Eureka (el API Gateway enruta con lb://CODIGOMS-CATALOGO)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Front React autorizado por CORS (cuando se llama directo, sin pasar por el Gateway)
app.cors.origins=http://localhost:5173,http://localhost:3000
